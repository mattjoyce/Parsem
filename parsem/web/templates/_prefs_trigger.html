{# "Aa" appearance-panel trigger (claude-rdk, spec §15.3). Opens the
   page-level #prefs-overlay; prefs.js binds it via event delegation on
   the .prefs-open class, so it survives the #reader-main partial swap.
   Used in the reader's top bar and the library header. #}
<button type="button" class="prefs-open" aria-label="Appearance" title="Appearance"><span class="prefs-open__big">A</span><span class="prefs-open__small">a</span></button>
